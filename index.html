
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語単語クイズ</title>
  <link rel="stylesheet" href="style.css"> 
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#205375">
</head>
<body>
  
<main class="container">
  <h1>日本語単語クイズ</h1>
  <p class="subtitle">日本語の単語を楽しく勉強しよう！</p>

  <section id="level-screen" class="quiz-card">
    <h2>レベルを選んでください</h2>
    <p>勉強したいレベルを選択してください。</p>

    <div class="level-buttons">
      <button class="level-button" data-level="N5">N5 初級</button>
      <button class="level-button" data-level="N4">N4 初中級</button>
      <button class="level-button" data-level="N3">N3 中級</button>
    </div>
  </section>

  <section id="quiz-screen" class="quiz-card" hidden>
    <p id="question-number"></p>
    <h2 id="question"></h2>

    <div id="choices" class="choices"></div>

    <p id="feedback" aria-live="polite"></p>
    <p id="score">スコア：0点</p>

    
<div class="navigation-buttons">
  <button id="back-button">レベル選択に戻る</button>
  <button id="next-button" hidden>次の問題</button>
</div>

  </section>
</main>
  <script src="script.js"></script>
</body>
</html>
